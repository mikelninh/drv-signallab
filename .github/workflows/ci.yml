name: SignalLab CI

on:
  push:
    branches: [main, feature/signallab-v1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pytest -q
      - name: Build engine-backed demo
        run: |
          rm -rf _site
          cp -R web _site
          python -m signallab.presentation
      - name: Check rendered frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('_site/index.html').read_text()
          match = re.search(r'<script>(.*)</script>', html, re.S)
          assert match, 'inline demo script not found'
          Path('/tmp/signallab-app.js').write_text(match.group(1))
          PY
          node --check /tmp/signallab-app.js
