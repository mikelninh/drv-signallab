name: Deploy SignalLab Demo

on:
  push:
    branches: [feature/signallab-v1, main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build demo
        run: |
          rm -rf _site
          cp -R web _site
          python - <<'PY'
          from pathlib import Path
          index = Path('_site/index.html')
          faq = Path('web/faq-snippet.html').read_text(encoding='utf-8')
          html = index.read_text(encoding='utf-8')
          anchor = '    <section class="panel method">'
          if anchor not in html:
              raise SystemExit('FAQ injection anchor not found')
          index.write_text(html.replace(anchor, faq + '\n\n' + anchor, 1), encoding='utf-8')
          PY
      - name: Upload demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
