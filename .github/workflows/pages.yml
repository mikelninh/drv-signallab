name: Deploy SignalLab Demo

on:
  push:
    branches: [feature/signallab-v1, main]
    paths:
      - 'web/**'
      - 'signallab/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install demo dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build engine-backed demo
        run: |
          rm -rf _site
          cp -R web _site
          python -m signallab.presentation
      - name: Upload demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
